<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultFan UA — ТОБІ БУДЕ ВЕСЕЛО!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        neonGreen: '#00ff66',
                        neonPink: '#ff007f',
                        neonYellow: '#ffcc00',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
        .font-impact { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans selection:bg-neonPink selection:text-white">

    <!-- Шапка сайту -->
    <header class="bg-cardBg/90 backdrop-blur border-b border-gray-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-impact tracking-wider text-white flex items-center gap-2">
                <span class="text-neonGreen">Mult</span><span class="text-neonPink">Fan</span> <span class="text-neonYellow">UA</span>
            </a>
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Шукати суєту..." onkeyup="filterMovies()" class="bg-darkBg border border-gray-700 rounded-full px-4 py-1.5 text-sm text-white focus:outline-none focus:border-neonGreen w-48 sm:w-64">
                <i class="fa-solid fa-search absolute right-3 top-2.5 text-gray-400 text-sm"></i>
            </div>
        </div>
    </header>

    <!-- Головний вміст -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="mb-8 p-6 rounded-2xl bg-gradient-to-r from-purple-900/40 via-pink-900/30 to-green-900/40 border border-gray-800">
            <span class="bg-neonPink text-black text-xs font-black px-2.5 py-1 rounded-full uppercase">TRENDING CHAOS</span>
            <h1 class="text-3xl sm:text-4xl font-impact font-black text-white mt-2">ВИБЕРИ СВІЙ ПОРТАЛ</h1>
            <p class="text-gray-400 text-sm mt-1">Обирай улюблений серіал та переходь до перегляду всіх сезонів українською!</p>
        </div>

        <!-- Сітка карток із посиланнями на окремі сторінки -->
        <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            
            <!-- Картка 1: Рік та Морті (веде на окрему сторінку) -->
            <a href="rick-and-morty.html" class="bg-cardBg rounded-2xl overflow-hidden shadow-xl hover:scale-105 transition duration-300 flex flex-col cursor-pointer border border-gray-800 hover:border-neonGreen group">
                <div class="relative aspect-[2/3] overflow-hidden bg-gray-900">
                    <img src="https://image.tmdb.org/t/p/w500/cvhNj9eoRBe5SxjCbQTkh05UP5N.jpg" alt="Рік та Морті" class="w-full h-full object-cover group-hover:opacity-90 transition">
                    <span class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-neonYellow text-xs px-2 py-1 rounded-lg font-black border border-yellow-500/30">
                        <i class="fa-solid fa-star"></i> 9.0
                    </span>
                </div>
                <div class="p-3 flex flex-col flex-1 justify-between">
                    <h4 class="font-bold text-sm text-white line-clamp-1 group-hover:text-neonGreen transition">Рік та Морті</h4>
                    <span class="text-xs text-gray-400 mt-1">Серіал (Усі сезони)</span>
                </div>
            </a>

            <!-- Сюди можна буде додавати інші картки аналогічно -->
        </div>
    </main>

    <footer class="bg-cardBg border-t border-gray-800 text-center py-6 text-gray-400 text-sm mt-12">
        <p>MultFan UA — Тобі буде весело! 👽🔥</p>
    </footer>

    <script>
        // Простий пошук по картках на головній
        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('#moviesGrid a');
            cards.forEach(card => {
                const title = card.querySelector('h4').textContent.toLowerCase();
                card.style.display = title.includes(query) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
