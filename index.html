<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultFan UA — Онлайн кінотеатр мультфільмів українською</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        accentRed: '#e50914',
                        accentHover: '#b20710',
                    }
                }
            }
        </script>
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Шапка сайту -->
    <header class="bg-cardBg border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="#" class="text-2xl font-black tracking-wider text-white flex items-center gap-2">
                <i class="fa-solid fa-clapperboard text-accentRed"></i>Mult<span class="text-accentRed">Fan</span> UA
            </a>
            
            <div class="flex items-center gap-4">
                <div class="relative hidden sm:block">
                    <input type="text" id="searchInput" placeholder="Пошук мультфільмів..." onkeyup="filterMovies()" class="bg-darkBg border border-gray-700 rounded-full px-4 py-1.5 text-sm text-white focus:outline-none focus:border-accentRed w-64">
                    <i class="fa-solid fa-search absolute right-3 top-2.5 text-gray-400 text-sm"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Головний вміст -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        
        <!-- Категорії -->
        <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 no-scrollbar">
            <button onclick="filterCategory('all')" class="px-4 py-1.5 bg-accentRed text-white rounded-full text-sm font-medium whitespace-nowrap transition">Усі</button>
            <button onclick="filterCategory('multfilm')" class="px-4 py-1.5 bg-cardBg hover:bg-gray-800 text-gray-300 rounded-full text-sm font-medium whitespace-nowrap transition border border-gray-700">Мультфільми</button>
            <button onclick="filterCategory('series')" class="px-4 py-1.5 bg-cardBg hover:bg-gray-800 text-gray-300 rounded-full text-sm font-medium whitespace-nowrap transition border border-gray-700">Мультсеріали</button>
            <button onclick="filterCategory('anime')" class="px-4 py-1.5 bg-cardBg hover:bg-gray-800 text-gray-300 rounded-full text-sm font-medium whitespace-nowrap transition border border-gray-700">Аніме</button>
        </div>

        <!-- Сітка карток фільмів -->
        <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <!-- Сюди автоматично завантажуються фільми з JavaScript -->
        </div>
    </main>

    <!-- Модальне вікно перегляду / плеєра -->
    <div id="playerModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-cardBg w-full max-w-4xl rounded-xl overflow-hidden border border-gray-800 shadow-2xl relative flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
                <h3 id="modalTitle" class="font-bold text-lg text-white">Назва мультфільму</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="relative w-full aspect-video bg-black">
                <iframe id="modalIframe" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="p-4 overflow-y-auto">
                <p id="modalDesc" class="text-gray-300 text-sm leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="bg-cardBg border-t border-gray-800 text-center py-6 text-gray-400 text-sm mt-12">
        <p>MultFan UA — Усі права захищено. Дивіться українською.</p>
    </footer>

    <!-- Скрипт з базою даних та логікою -->
    <script>
        // База даних ваших мультфільмів та фільмів
        const movies = [
            {
                id: 1,
                title: "Памфір",
                category: "multfilm", // тут може бути художній фільм або драма
                year: "2022",
                rating: "7.4",
                poster: "https://full4k.kinoklass.net/uploads/posts/2023-06/pamfir-2022.webp",
                trailer: "https://www.youtube.com/embed/bRqmFp7ZdC8",
                description: "Памфир — в прошлом контрабандист, ныне зарабатывающий строительными работами. Он вернулся с заработков в родное село накануне зимних праздников..."
            },
            {
                id: 2,
                title: "Мавка: Лісова пісня",
                category: "multfilm",
                year: "2023",
                rating: "8.1",
                poster: "https://image.tmdb.org/t/p/w500/eeJc7aU9PMMUSKCBb99xQW5R0q1.jpg",
                trailer: "https://www.youtube.com/embed/1W9b6h4s0c8",
                description: "Мавка — Душа Лісу і його майбутня Охоронець — стикається з неможливим вибором між коханням і обов'язком перед лісом..."
            },
            {
                id: 3,
                title: "Людина-Павук: Крізь всесвіт",
                category: "multfilm",
                year: "2023",
                rating: "8.7",
                poster: "https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg",
                trailer: "https://www.youtube.com/embed/cqGjhVJWtEg",
                description: "Майлз Моралес вирушає у пригоду мультивсесвітом разом із Гвен Стейсі..."
            }
        ];

        const moviesGrid = document.getElementById('moviesGrid');
        const modal = document.getElementById('playerModal');
        const modalIframe = document.getElementById('modalIframe');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        // Функція виведення карток на екран
        function displayMovies(moviesToDisplay) {
            moviesGrid.innerHTML = '';
            if (moviesToDisplay.length === 0) {
                moviesGrid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">Нічого не знайдено</p>`;
                return;
            }
            
            moviesToDisplay.forEach(movie => {
                const card = document.createElement('div');
                card.className = "bg-cardBg rounded-xl overflow-hidden shadow-lg hover:scale-105 transition duration-300 flex flex-col cursor-pointer border border-gray-800";
                card.onclick = () => openModal(movie);
                
                card.innerHTML = `
                    <div class="relative aspect-[2/3] overflow-hidden bg-gray-900">
                        <img src="${movie.poster}" alt="${movie.title}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-black/70 backdrop-blur-md text-yellow-400 text-xs px-2 py-1 rounded font-bold">
                            <i class="fa-solid fa-star"></i> ${movie.rating}
                        </span>
                    </div>
                    <div class="p-3 flex flex-col flex-1 justify-between">
                        <h4 class="font-bold text-sm text-white line-clamp-1">${movie.title}</h4>
                        <span class="text-xs text-gray-400 mt-1">${movie.year}</span>
                    </div>
                `;
                moviesGrid.appendChild(card);
            });
        }

        // Відкрити плеєр
        function openModal(movie) {
            modalTitle.textContent = movie.title;
            modalDesc.textContent = movie.description;
            modalIframe.src = movie.trailer;
            modal.classList.remove('hidden');
        }

        // Закрити плеєр
        function closeModal() {
            modal.classList.add('hidden');
            modalIframe.src = '';
        }

        // Фільтрація за категоріями
        function filterCategory(category) {
            if (category === 'all') {
                displayMovies(movies);
            } else {
                const filtered = movies.filter(m => m.category === category);
                displayMovies(filtered);
            }
        }

        // Пошук за назвою
        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = movies.filter(m => m.title.toLowerCase().includes(query));
            displayMovies(filtered);
        }

        // Запуск при завантаженні
        displayMovies(movies);
    </script>
</body>
</html>
